{% extends "home/base.html" %}

{% block extra_css %}
<style>
.reset-page {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 100px 24px 60px;
  position: relative;
  z-index: 10;
}

.reset-card {
  width: 100%; max-width: 480px;
  background: rgba(13,13,28,0.85);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
  position: relative; overflow: hidden;
  animation: card-in 0.7s ease both;
}

@keyframes card-in {
  from { opacity: 0; transform: translateY(32px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-head {
  padding: 40px 40px 24px; text-align: center;
  border-bottom: 1px solid var(--border);
}

.card-title {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(14px, 2.5vw, 18px); color: var(--white);
  line-height: 1.6; margin-bottom: 8px;
}
.card-title span { color: var(--cyan); }

.card-sub { font-size: 10px; color: var(--muted); letter-spacing: 2px; }

.reset-form { padding: 32px 40px 40px; }

.form-row { margin-bottom: 22px; }

.form-label {
  display: block; font-size: 9px; letter-spacing: 3px;
  color: var(--muted2); text-transform: uppercase; margin-bottom: 8px;
}
.form-label span { color: var(--cyan); margin-right: 6px; }

.form-input {
  width: 100%; padding: 13px 16px;
  background: rgba(9,9,15,.7); border: 1px solid var(--border);
  color: var(--white); font-family: 'JetBrains Mono', monospace;
  font-size: 13px; outline: none; transition: all .25s;
  clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
}

.form-input:focus {
  border-color: var(--cyan); background: rgba(0,229,204,.04);
  box-shadow: 0 0 20px rgba(0,229,204,.1);
}

.form-submit {
  width: 100%; padding: 16px;
  font-family: 'Press Start 2P', monospace; font-size: 10px;
  letter-spacing: 2px; text-transform: uppercase;
  background: linear-gradient(135deg, var(--purple), var(--purple2));
  color: white; border: none; cursor: pointer;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  transition: all .25s; margin-top: 8px;
}
.form-submit:hover {
  background: linear-gradient(135deg, var(--cyan), #00c4ad);
  color: var(--obsidian); transform: translateY(-2px);
}
</style>
{% endblock %}

{% block content %}
<main class="reset-page">
  <div class="reset-card">

    <div class="card-head">
      <h1 class="card-title">Reset <span>Password</span></h1>
      <p class="card-sub">Enter your registered email address</p>
    </div>

    {% if messages %}
      <div style="padding: 16px 40px 0;">
        {% for message in messages %}
          <div style="font-size: 11px; color: var(--lava); margin-bottom: 8px;">
            ▸ {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form class="reset-form" method="POST" action="{% url 'password_reset' %}">
      {% csrf_token %}

      <div class="form-row">
        <label class="form-label"><span>//</span> Account Email</label>
        <input class="form-input" type="email" name="email" placeholder="you@example.com" required autofocus />
      </div>

      <button class="form-submit" type="submit">
        <span>▶ &nbsp;SEND RESET LINK</span>
      </button>
    </form>

  </div>
</main>
{% endblock %}
