{% extends "home/base.html" %}

{% block extra_css %}
<style>
.reset-page {
  flex: 1; display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 100px 24px 60px; position: relative; z-index: 10;
}
.reset-card {
  width: 100%; max-width: 480px; background: rgba(13,13,28,0.85);
  border: 1px solid var(--border); backdrop-filter: blur(20px);
  padding: 40px; text-align: center;
}
.card-title {
  font-family: 'Press Start 2P', monospace; font-size: 16px; color: var(--cyan);
  margin-bottom: 16px; line-height: 1.6;
}
.card-sub { font-size: 11px; color: var(--muted); line-height: 1.8; margin-bottom: 24px; }
.back-btn {
  display: inline-block; padding: 12px 24px; background: rgba(0,229,204,.1);
  border: 1px solid var(--cyan); color: var(--cyan); text-decoration: none;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px;
}
.back-btn:hover { background: var(--cyan); color: var(--obsidian); }
</style>
{% endblock %}

{% block content %}
<main class="reset-page">
  <div class="reset-card">
    <h1 class="card-title">EMAIL SENT</h1>
    <p class="card-sub">If an account exists for the email provided, a password reset link has been sent to your inbox. Please check your email.</p>
    <a href="{% url 'auth' %}" class="back-btn">▶ RETURN TO LOGIN</a>
  </div>
</main>
{% endblock %}
