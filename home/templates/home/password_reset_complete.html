{% extends "home/base.html" %}

{% block extra_css %}
<style>
.reset-page {
  flex: 1; display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 100px 24px 60px; position: relative; z-index: 10;
}
.reset-card {
  width: 100%; max-width: 480px; background: rgba(13,13,28,0.85);
  border: 1px solid var(--border); backdrop-filter: blur(20px);
  padding: 40px; text-align: center;
}
.card-title {
  font-family: 'Press Start 2P', monospace; font-size: 16px; color: var(--cyan);
  margin-bottom: 16px; line-height: 1.6;
}
.card-sub { font-size: 11px; color: var(--muted); line-height: 1.8; margin-bottom: 24px; }
.login-btn {
  display: inline-block; padding: 14px 28px; background: linear-gradient(135deg, var(--cyan), #00c4ad);
  color: var(--obsidian); text-decoration: none; font-family: 'Press Start 2P', monospace;
  font-size: 10px; letter-spacing: 2px;
}
.login-btn:hover { background: linear-gradient(135deg, var(--purple), var(--purple2)); color: #fff; }
</style>
{% endblock %}

{% block content %}
<main class="reset-page">
  <div class="reset-card">
    <h1 class="card-title">PASSWORD RESET</h1>
    <p class="card-sub">Your password has been successfully updated. You can now log in using your new password.</p>
    <a href="{% url 'auth' %}" class="login-btn">▶ PROCEED TO LOGIN</a>
  </div>
</main>
{% endblock %}
